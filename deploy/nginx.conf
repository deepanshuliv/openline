# Gateway for the openline Compose project. Published only on 127.0.0.1:8100;
# Caddy terminates TLS in front of it.

# Re-resolve service names so a recreated container's new IP is picked up
# (DEPLOYMENT.md section 6, items 2 and 17).
resolver 127.0.0.11 valid=1s ipv6=off;

upstream api {
    zone api 64k;
    server api:4000 resolve max_fails=0;
    keepalive 16;
}

upstream web {
    zone web 64k;
    server web:3000 resolve max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /health {
        proxy_pass http://api;
    }

    # REST plus two SSE streams (/api/calls/:id/events/stream, /api/handoffs/stream).
    location /api/ {
        proxy_pass http://api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web;
    }
}
